name: Spot AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: spot-ai-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: spot_ai_bot
        run: pip install -r requirements.txt

      - name: Create environment
        working-directory: spot_ai_bot
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\n' '${{ secrets.TELEGRAM_BOT_TOKEN }}' > .env
          printf 'TELEGRAM_CHAT_ID=%s\n' '${{ secrets.TELEGRAM_CHAT_ID }}' >> .env

      - name: Run one paper scan
        working-directory: spot_ai_bot
        run: python src/bot.py --once

      - name: Persist paper journal
        run: |
          git config user.name 'spot-ai-bot'
          git config user.email 'spot-ai-bot@users.noreply.github.com'
          git add spot_ai_bot/data/bot.db
          git diff --cached --quiet || (git commit -m 'Update paper trading journal [skip ci]' && git push)
